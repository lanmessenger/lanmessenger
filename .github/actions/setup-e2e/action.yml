# Setup for demo-video.yml: installs system deps, Qt, builds the lmc release
# layout, the lan-messenger-test binary that carries the in-process lmc-agent,
# and creates the Robot venv. (e2e.yml no longer uses this: since the Build
# split it downloads the test layout from build.yml instead of compiling.)
# Used via `uses: ./.github/actions/setup-e2e` from demo-video.yml.
name: Set up E2E dependencies
description: Qt + lmc release build + lan-messenger-test agent binary + Robot venv

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake git \
          libssl-dev libgl1-mesa-dev \
          xvfb xauth x11-utils \
          python3-pip python3-venv

    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: linux
        target: desktop
        arch: linux_gcc_64
        modules: 'qtmultimedia qtshadertools'
        cache: true

    - name: Configure
      shell: bash
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLMC_RELEASE_DIR="$PWD/lmc/release"

    - name: Build release layout
      shell: bash
      run: cmake --build build --config Release --target package-local --parallel

    # The E2E agent is linked into the test binary (see
    # tools/lmc-agent/PROTOCOL.md): test-main.cpp starts the agent server
    # from LMC_AGENT_PORT (default 9999). The binary is copied into the
    # release layout by hand: an install(TARGETS) rule would leak it
    # into the packages built from that directory.
    - name: Build the test agent binary
      shell: bash
      run: |
        cmake --build build --config Release --target lan-messenger-test --parallel
        cp build/tools/lmc-agent/lan-messenger-test lmc/release/
        test -x lmc/release/lan-messenger-test

    # The mock-peer daemon for chat.robot and the lmm/ self-checks: not a
    # dependency of package-local, so it needs its own build step.
    - name: Build the mock daemon
      shell: bash
      run: |
        cmake --build build --config Release --target lmmd --parallel
        test -x build/tools/lmm/lmmd

    - name: Set up Python and Robot Framework
      shell: bash
      run: |
        python3 -m venv .venv-robot-ci
        .venv-robot-ci/bin/pip install -r tests/robot/requirements.txt
