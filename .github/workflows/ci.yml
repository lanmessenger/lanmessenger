name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version string used in package names
        type: string
        default: ''
      installer_version:
        description: Four-part version for the Windows installer
        type: string
        default: ''
      ref:
        description: Git ref to build (defaults to the triggering commit)
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style gate for lmc/src. Version pinned to match tools/format.sh and .clang-format.
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find lmc/src -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format-18 --dry-run -Werror

  # Linux, oldest baseline (Ubuntu 22.04, Qt 6.2, glibc 2.35): one _min
  # package per arch installs and runs on any newer Debian-family distro.
  build-linux:
    needs: [format-check]
    runs-on: ubuntu-22.04
    env:
      PKG_VERSION: ${{ inputs.version || format('0.0.0.{0}', github.run_number) }}
      PKG_INSTALLER_VERSION: ${{ inputs.installer_version || format('0.0.0.{0}', github.run_number) }}
      QTDIR: /usr/lib/x86_64-linux-gnu/qt6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev qt6-base-dev-tools \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-translations-l10n \
            qt6-multimedia-dev \
            libssl-dev libgl1-mesa-dev \
            xvfb xauth

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLMC_RELEASE_DIR="$PWD/lmc/release" -DLMC_VERSION="$PKG_VERSION"

      - name: Build release layout
        run: cmake --build build --config Release --target package-local --parallel

      - name: Smoke test
        run: |
          export USER=ci
          cd lmc/release
          export LD_LIBRARY_PATH="$PWD"
          timeout 60 xvfb-run -a ./lan-messenger.sh /loopback /noconfig /quit

      - name: Build e2e test
        run: cmake --build build --config Release --target tst_lmc_gui --parallel

      - name: E2E GUI test
        timeout-minutes: 5
        run: |
          export USER=ci
          cp build/tests/tst_lmc_gui lmc/release/
          cd lmc/release
          export LD_LIBRARY_PATH="$PWD"
          export LMC_E2E_ARTIFACTS_DIR="$GITHUB_WORKSPACE/e2e-artifacts"
          xvfb-run -a ./tst_lmc_gui

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-linux
          path: e2e-artifacts
          if-no-files-found: warn
          retention-days: 3

      - name: Build packages
        env:
          PACKAGE_MODE: _min
        run: |
          sudo apt-get install -y alien rpm
          cd lmc/setup/x11
          chmod +x setup rpm_setup
          sh ./setup "$PKG_VERSION"
          sh ./rpm_setup "$PKG_VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: |
            lmc/setup/lmc_*_min.deb
            lmc/setup/lmc-*_min.rpm
          if-no-files-found: error
          retention-days: 3

  build-windows:
    needs: [format-check]
    runs-on: windows-2022
    env:
      PKG_VERSION: ${{ inputs.version || format('0.0.0.{0}', github.run_number) }}
      PKG_INSTALLER_VERSION: ${{ inputs.installer_version || format('0.0.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install OpenSSL
        run: vcpkg install openssl:x64-windows

      - name: Prepare OpenSSL paths
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          New-Item -ItemType Directory -Force openssl/include, openssl/lib, openssl/bin | Out-Null
          Copy-Item -Recurse $root/installed/x64-windows/include/openssl openssl/include/
          Copy-Item $root/installed/x64-windows/lib/libcrypto.lib openssl/lib/
          Copy-Item $root/installed/x64-windows/bin/libcrypto-*.dll openssl/bin/
          Copy-Item $root/installed/x64-windows/bin/libssl-*.dll openssl/bin/

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release "-DLMC_RELEASE_DIR=$PWD/lmc/release" "-DLMC_VERSION=$PKG_VERSION")
          if [ -d openssl ]; then
            args+=("-DOPENSSL_ROOT_DIR=$PWD/openssl")
          fi
          cmake "${args[@]}"

      - name: Build release layout
        run: cmake --build build --config Release --target package-local --parallel

      - name: Deploy Qt runtime
        shell: cmd
        run: |
          set QTDIR=%QT_ROOT_DIR%
          windeployqt --release lmc\release\lmc.exe

      # QSslSocket needs the Qt 6 TLS backend plugins; deploy them explicitly
      # in case windeployqt skipped them.
      - name: Ensure TLS plugins
        shell: pwsh
        run: |
          $dst = "lmc/release/tls"
          if (-not (Test-Path $dst)) {
            Copy-Item -Recurse "$env:QT_ROOT_DIR/plugins/tls" $dst
          }

      - name: Build e2e test
        run: cmake --build build --config Release --target tst_lmc_gui --parallel

      - name: E2E GUI test
        timeout-minutes: 5
        shell: pwsh
        run: |
          Copy-Item build/tests/tst_lmc_gui.exe lmc/release/
          Set-Location lmc/release
          $env:LMC_E2E_ARTIFACTS_DIR = "$env:GITHUB_WORKSPACE/e2e-artifacts"
          .\tst_lmc_gui.exe

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-windows
          path: e2e-artifacts
          if-no-files-found: warn
          retention-days: 3

      - name: Build installer
        shell: cmd
        run: |
          choco install nsis -y --no-progress
          cd lmc\setup\win32
          call setup.bat release %PKG_VERSION% %PKG_INSTALLER_VERSION%

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: lmc/setup/lmc-*-win64.exe
          if-no-files-found: error
          retention-days: 3

  build-macos:
    needs: [format-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: macos-15-intel
          - arch: arm64
            runs-on: macos-14
    runs-on: ${{ matrix.runs-on }}
    env:
      PKG_VERSION: ${{ inputs.version || format('0.0.0.{0}', github.run_number) }}
      PKG_INSTALLER_VERSION: ${{ inputs.installer_version || format('0.0.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          modules: 'qtmultimedia qtshadertools qtimageformats'
          cache: true

      - name: Install OpenSSL
        run: |
          brew install openssl@3
          mkdir -p openssl
          ln -sfn "$(brew --prefix openssl@3)/include" openssl/include
          ln -sfn "$(brew --prefix openssl@3)/lib" openssl/lib

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release "-DLMC_RELEASE_DIR=$PWD/lmc/release" "-DLMC_VERSION=$PKG_VERSION")
          if [ -d openssl ]; then
            args+=("-DOPENSSL_ROOT_DIR=$PWD/openssl")
          fi
          cmake "${args[@]}"

      - name: Build release layout
        run: cmake --build build --config Release --target package-local --parallel

      - name: Verify native binary arch
        run: |
          lipo -archs lmc/release/LAN-Messenger.app/Contents/MacOS/LAN-Messenger | grep -q ${{ matrix.arch }}

      - name: Build disk image
        run: |
          set -euo pipefail
          export QTDIR="$QT_ROOT_DIR"
          cd lmc/setup/mac
          chmod +x stage-mac-app
          sh ./stage-mac-app
          # Hermetic venv: works with any python3 (system/Homebrew/toolcache),
          # immune to PEP 668, no --break-system-packages, no new actions.
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/pip" install "dmgbuild==1.6.7"
          rm -f "../lmc_${PKG_VERSION}_${{ matrix.arch }}.dmg"
          "$RUNNER_TEMP/dmgbuild-venv/bin/dmgbuild" -s dmg-settings.py \
            "LAN-Messenger" "../lmc_${PKG_VERSION}_${{ matrix.arch }}.dmg"
          test -f "../lmc_${PKG_VERSION}_${{ matrix.arch }}.dmg"
          ls -lh "../lmc_${PKG_VERSION}_${{ matrix.arch }}.dmg"
          rm -rf LAN-Messenger.app

      - name: List disk image artifacts
        if: always()
        run: |
          ls -lh lmc/setup/*.dmg || true

      # After stage-mac-app: it copies lmc/release/LAN-Messenger.app into
      # lmc/setup/mac/ for the DMG, so the test binary added here never ships.
      # It goes next to liblmcapp.2.dylib (@executable_path install name) and
      # lmc.rcc (LMC_APP_DIR defaults to applicationDirPath).
      - name: Build e2e test
        run: cmake --build build --config Release --target tst_lmc_gui --parallel

      - name: E2E GUI test
        timeout-minutes: 5
        run: |
          cp build/tests/tst_lmc_gui lmc/release/LAN-Messenger.app/Contents/MacOS/
          cd lmc/release
          export DYLD_FRAMEWORK_PATH="$QT_ROOT_DIR/lib"
          export DYLD_LIBRARY_PATH="$PWD/LAN-Messenger.app/Contents/MacOS:$QT_ROOT_DIR/lib"
          export LMC_E2E_ARTIFACTS_DIR="$GITHUB_WORKSPACE/e2e-artifacts"
          ./LAN-Messenger.app/Contents/MacOS/tst_lmc_gui

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-macos-${{ matrix.arch }}
          path: e2e-artifacts
          if-no-files-found: warn
          retention-days: 3

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-macos-${{ matrix.arch }}
          path: lmc/setup/lmc_*_${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 3
