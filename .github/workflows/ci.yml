name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version string used in package names
        type: string
        default: ''
      installer_version:
        description: Four-part version for the Windows installer
        type: string
        default: ''
      ref:
        description: Git ref to build (defaults to the triggering commit)
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux, Qt 6.8 from aqt: compile/smoke check against the primary target.
  # No packages here; the runnable layout is uploaded for manual testing.
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libssl-dev libgl1-mesa-dev \
            xvfb xauth

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia qtshadertools'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLMC_RELEASE_DIR="$PWD/lmc/release"

      - name: Build release layout
        run: cmake --build build --config Release --target package-local --parallel

      # Run the binary directly: lan-messenger.sh overwrites LD_LIBRARY_PATH
      # with its own directory only, which would hide the aqt Qt libraries.
      - name: Smoke test
        run: |
          export USER=ci
          cd lmc/release
          export LD_LIBRARY_PATH="$PWD:$QT_ROOT_DIR/lib"
          timeout 60 xvfb-run -a ./lan-messenger /loopback /noconfig /quit

      - name: Upload release layout
        uses: actions/upload-artifact@v7
        with:
          name: manual-test-linux-qt68
          path: lmc/release
          if-no-files-found: error
          retention-days: 3

  # Linux, system Qt 6.4 (Ubuntu 24.04): the minimum supported Qt. Builds the
  # deb/rpm packages against it and smoke-tests the same layout they ship.
  build-linux-deb:
    runs-on: ubuntu-24.04
    env:
      PKG_VERSION: ${{ inputs.version || format('0.0.0.{0}', github.run_number) }}
      PKG_INSTALLER_VERSION: ${{ inputs.installer_version || format('0.0.0.{0}', github.run_number) }}
      QTDIR: /usr/lib/x86_64-linux-gnu/qt6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev qt6-base-dev-tools \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-multimedia-dev \
            libssl-dev libgl1-mesa-dev \
            xvfb xauth

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLMC_RELEASE_DIR="$PWD/lmc/release"

      - name: Build release layout
        run: cmake --build build --config Release --target package-local --parallel

      - name: Smoke test
        run: |
          export USER=ci
          cd lmc/release
          export LD_LIBRARY_PATH="$PWD"
          timeout 60 xvfb-run -a ./lan-messenger.sh /loopback /noconfig /quit

      - name: Build packages
        env:
          PACKAGE_MODE: _min
        run: |
          sudo apt-get install -y alien rpm
          cd lmc/setup/x11
          chmod +x setup rpm_setup
          sh ./setup "$PKG_VERSION"
          sh ./rpm_setup "$PKG_VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: |
            lmc/setup/lmc_*_min.deb
            lmc/setup/lmc-*_min.rpm
          if-no-files-found: error
          retention-days: 3

  build-windows:
    runs-on: windows-2022
    env:
      PKG_VERSION: ${{ inputs.version || format('0.0.0.{0}', github.run_number) }}
      PKG_INSTALLER_VERSION: ${{ inputs.installer_version || format('0.0.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install OpenSSL
        run: vcpkg install openssl:x64-windows

      - name: Prepare OpenSSL paths
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          New-Item -ItemType Directory -Force openssl/include, openssl/lib, openssl/bin | Out-Null
          Copy-Item -Recurse $root/installed/x64-windows/include/openssl openssl/include/
          Copy-Item $root/installed/x64-windows/lib/libcrypto.lib openssl/lib/
          Copy-Item $root/installed/x64-windows/bin/libcrypto-*.dll openssl/bin/
          Copy-Item $root/installed/x64-windows/bin/libssl-*.dll openssl/bin/

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release "-DLMC_RELEASE_DIR=$PWD/lmc/release")
          if [ -d openssl ]; then
            args+=("-DOPENSSL_ROOT_DIR=$PWD/openssl")
          fi
          cmake "${args[@]}"

      - name: Build release layout
        run: cmake --build build --config Release --target package-local --parallel

      - name: Deploy Qt runtime
        shell: cmd
        run: |
          set QTDIR=%QT_ROOT_DIR%
          windeployqt --release lmc\release\lmc.exe

      # QSslSocket needs the Qt 6 TLS backend plugins; deploy them explicitly
      # in case windeployqt skipped them.
      - name: Ensure TLS plugins
        shell: pwsh
        run: |
          $dst = "lmc/release/tls"
          if (-not (Test-Path $dst)) {
            Copy-Item -Recurse "$env:QT_ROOT_DIR/plugins/tls" $dst
          }

      - name: Build installer
        shell: cmd
        run: |
          choco install nsis -y --no-progress
          cd lmc\setup\win32
          call setup.bat release %PKG_VERSION% %PKG_INSTALLER_VERSION%

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: lmc/setup/lmc-*-win64.exe
          if-no-files-found: error
          retention-days: 3

  build-macos:
    runs-on: macos-15-intel
    env:
      PKG_VERSION: ${{ inputs.version || format('0.0.0.{0}', github.run_number) }}
      PKG_INSTALLER_VERSION: ${{ inputs.installer_version || format('0.0.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          modules: 'qtmultimedia qtshadertools qtimageformats'
          cache: true

      - name: Install OpenSSL
        run: |
          brew install openssl@3
          mkdir -p openssl
          ln -sfn "$(brew --prefix openssl@3)/include" openssl/include
          ln -sfn "$(brew --prefix openssl@3)/lib" openssl/lib

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release "-DLMC_RELEASE_DIR=$PWD/lmc/release")
          if [ -d openssl ]; then
            args+=("-DOPENSSL_ROOT_DIR=$PWD/openssl")
          fi
          cmake "${args[@]}"

      - name: Build release layout
        run: cmake --build build --config Release --target package-local --parallel

      - name: Build disk image
        run: |
          export QTDIR="$QT_ROOT_DIR"
          cd lmc/setup/mac
          chmod +x createdisk addlicense
          sh ./createdisk
          sh ./addlicense "$PKG_VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: lmc/setup/lmc_*_intel.dmg
          if-no-files-found: error
          retention-days: 3
