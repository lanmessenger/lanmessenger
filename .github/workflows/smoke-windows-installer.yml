# Smoke test for the Windows NSIS installer: silent-installs the exact
# packages-windows artifact built by ci.yml on a fresh runner and starts
# the installed app. Shared by release.yml and nightly.yml so the two
# publish gates cannot drift apart.
#
# No inputs needed: the artifact name (packages-windows) and the isolated
# install dir (C:\lmc-smoke) are fixed. No rebuild here by design.
name: Smoke Windows installer

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-windows
          path: dist
          merge-multiple: true

      - name: List installer artifact
        shell: pwsh
        run: Get-ChildItem dist

      # NSIS silent flags; /D= isolates the test from $PROGRAMFILES and
      # from registry state of any previous install. No rebuild here:
      # we test the exact .exe that will be published.
      # Start-Process (not & + $LASTEXITCODE): .ExitCode is reliable even
      # when the child dies at startup without reporting a code, and
      # -Wait blocks until a UAC-detached or self-relauching stub exits.
      - name: Silent install
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/lmc-*-win64.exe | Select-Object -First 1
          if (-not $exe) { throw 'installer not found in dist/' }
          $p = Start-Process $exe.FullName -ArgumentList '/S', '/D=C:\lmc-smoke' `
            -Wait -PassThru -NoNewWindow
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Write-Host '--- install dir ---'
            if (Test-Path 'C:\lmc-smoke') { Get-ChildItem 'C:\lmc-smoke' | Out-Host }
            else { Write-Host 'C:\lmc-smoke does not exist' }
            Write-Host '--- registry ---'
            Get-Item 'HKLM:\SOFTWARE\LAN Messenger' -ErrorAction SilentlyContinue | Out-Host
            throw "silent install failed with exit code $($p.ExitCode)"
          }

      - name: Verify installed layout
        shell: pwsh
        run: |
          @('C:\lmc-smoke\lmc.exe', 'C:\lmc-smoke\lmc.rcc', 'C:\lmc-smoke\uninst.exe',
            'C:\lmc-smoke\Qt6Core.dll', 'C:\lmc-smoke\Qt6Widgets.dll') | ForEach-Object {
            if (-not (Test-Path $_)) { throw "missing $_" } }
          # Translations gate: one app .qm and one Qt system .qm. de_DE is
          # pinned because qtbase_de.qm is the configure-time sentinel
          # (lmc/lmc/CMakeLists.txt), so both files must always ship.
          @('C:\lmc-smoke\lang\de_DE.qm',
            'C:\lmc-smoke\lang\system\qtbase_de.qm') | ForEach-Object {
            if (-not (Test-Path $_)) { throw "missing $_" } }
          if (-not (Test-Path 'C:\lmc-smoke\tls')) { throw 'missing tls plugins' }
          if (-not (Get-ChildItem C:\lmc-smoke\libcrypto-*.dll -ErrorAction SilentlyContinue)) {
            throw 'missing openssl dlls' }

      # No console window allowed: the lmc target is built as a WIN32 GUI app,
      # so it must never spawn a conhost child. A console subsystem regression
      # (e.g. a lost WIN32 flag in CMake) shows up here as conhost.exe with
      # lmc.exe as its parent. This is a strict publish gate, not eyeballing.
      # No /quit here: we need a living process with an event loop. Main window
      # handle is NOT polled: with a fresh profile AutoShow defaults to off,
      # so the app may sit in the tray with no visible window — conhost state
      # is independent of that (attached at process creation for console apps,
      # never for GUI apps).
      - name: Assert no console window (conhost gate)
        shell: pwsh
        run: |
          $p = Start-Process 'C:\lmc-smoke\lmc.exe' `
            -ArgumentList '/silent', '/loopback', '/noconfig' `
            -PassThru -NoNewWindow
          try {
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline) {
              $p.Refresh()
              if ($p.HasExited) { throw "lmc.exe exited prematurely (code $($p.ExitCode))" }
              $conhost = Get-CimInstance Win32_Process `
                -Filter "ParentProcessId=$($p.Id) AND Name='conhost.exe'" `
                -ErrorAction SilentlyContinue
              if ($conhost) { throw 'console window detected: conhost.exe is a child of lmc.exe' }
              Start-Sleep -Seconds 1
            }
            $p.Refresh()
            if ($p.HasExited) { throw "lmc.exe exited prematurely (code $($p.ExitCode))" }
            Write-Host 'no console window: lmc.exe runs without a conhost child'
          } finally {
            if (-not $p.HasExited) {
              $p | Stop-Process -Force
              $p.WaitForExit(10000) | Out-Null
            }
          }

      # /quit exits after lmcCore::init (windows, resources, messaging init)
      # without entering the event loop — same coverage as the Linux smoke.
      # Start-Process + WaitForExit caps a hang on a blocking QMessageBox
      # (e.g. the missing-SSL dialog in main.cpp ignores /silent).
      - name: Smoke start installed app
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process 'C:\lmc-smoke\lmc.exe' `
            -ArgumentList '/silent', '/loopback', '/noconfig', '/quit' `
            -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) {
            $p | Stop-Process -Force
            throw 'smoke timed out after 60s (possible blocking dialog, e.g. missing SSL)'
          }
          if ($p.ExitCode -ne 0) { throw "smoke failed: $($p.ExitCode)" }
          $sw.Stop()
          Write-Host "init time: $($sw.Elapsed.TotalSeconds.ToString('0.0'))s"
          $inst = Start-Process 'C:\lmc-smoke\lmc.exe' -ArgumentList '/inst' `
            -Wait -PassThru -NoNewWindow
          Write-Host "lmc /inst exit code: $($inst.ExitCode)"
          if ($inst.ExitCode -ne 0) { throw '/inst should return 0 when no instance is running' }
