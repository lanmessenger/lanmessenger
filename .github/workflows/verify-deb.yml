# Smoke test for the Linux .deb package: installs the exact
# packages-linux artifact built by build.yml on fresh runners at both ends of
# the supported range (22.04/24.04) and starts
# the installed app. Shared by release.yml and nightly.yml so the two
# publish gates cannot drift apart.
#
# No inputs needed: the artifact name (packages-linux) is fixed, and the
# install goes to the real system paths (/usr/...) — the runner is
# ephemeral. No rebuild here by design. The .rpm/.pkg.tar.zst sides are
# covered by verify-rpm.yml/verify-arch.yml; all three formats are built
# from the same staged payload tree by setup/linux (see nfpm.yaml) and
# share the payload.
name: Verify deb

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-linux
          path: dist
          merge-multiple: true

      - name: List package artifact
        run: ls -la dist

      # apt resolves the system Qt 6.4 + libssl deps declared in
      # setup/linux/nfpm.yaml; xvfb is for the headless smoke start below.
      - name: Install package
        run: |
          set -euo pipefail
          deb=(dist/lmc_*.deb)
          if [ ! -f "${deb[0]}" ]; then echo 'deb not found in dist/' >&2; exit 1; fi
          sudo apt-get update
          sudo apt-get install -y "./${deb[0]}" xvfb x11-utils appstream
          dpkg -L lmc

      - name: Verify installed layout
        run: |
          set -euo pipefail
          command -v lmc
          test -L /usr/bin/lmc
          for f in /usr/lib/lmc/lan-messenger /usr/lib/lmc/lmc.sh /usr/lib/lmc/lmc.rcc \
                   /usr/share/applications/lmc.desktop \
                   /usr/share/metainfo/lmc.metainfo.xml \
                   /usr/lib/lmc/lang/de_DE.qm /usr/lib/lmc/lang/system/qtbase_de.qm; do
            test -e "$f" || { echo "missing $f" >&2; exit 1; }
          done
          # No bundled sqldrivers/: system packages use the distro driver.
          # Gate both the dependency metadata and the actual plugin file.
          dpkg-deb -f dist/lmc_*.deb Depends | tr ',' '\n' | grep -Eq 'libqt6sql6-sqlite' \
            || { echo 'deb missing Depends: libqt6sql6-sqlite' >&2; exit 1; }
          dpkg -L libqt6sql6-sqlite | grep -Eq 'libqsqlite\.so$' \
            || { echo 'system QSQLite driver file missing' >&2; exit 1; }

      - name: Validate AppStream metadata
        run: |
          set -euo pipefail
          appstreamcli validate --no-net /usr/share/metainfo/lmc.metainfo.xml

      # One shared X server for the smoke steps below: steps of a job share
      # the runner, so Xvfb started here outlives this step. DISPLAY/USER/
      # QT_QPA_PLATFORM go to $GITHUB_ENV for the smoke steps. No trap/kill
      # needed — the ephemeral runner is discarded with the job.
      #
      # Explicit Xvfb with an xdpyinfo wait instead of xvfb-run -a: xvfb-run
      # does not wait for the X server to be ready, so Qt occasionally
      # connects too early ("could not connect to display" flake). A live
      # xdpyinfo round-trip proves more than the socket showing up.
      - name: Start Xvfb
        run: |
          set -euo pipefail
          disp=""
          for n in 99 100 101 102; do
            if [ ! -e /tmp/.X$n-lock ] && [ ! -S /tmp/.X11-unix/X$n ]; then disp=$n; break; fi
          done
          if [ -z "$disp" ]; then echo 'no free X display' >&2; exit 1; fi
          Xvfb :$disp -screen 0 1280x1024x24 &
          for _ in $(seq 1 30); do
            xdpyinfo -display :$disp >/dev/null 2>&1 && break || sleep 1
          done
          xdpyinfo -display :$disp >/dev/null || { echo 'Xvfb did not start' >&2; exit 1; }
          echo "DISPLAY=:$disp" >> "$GITHUB_ENV"
          echo "USER=ci" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM=xcb" >> "$GITHUB_ENV"

      # Two-stage smoke (experimental): a plain launch goes through exec()
      # (event loop, main window, single-instance IPC), then a second
      # invocation closes it via /termwait (sends term, waits for the lock
      # release — covers exitApp/shuttingDown and the /termwait branches in
      # apprunner.cpp). A lone /quit exits before exec() (see apprunner.cpp)
      # and would miss all of that. Note: /quit sent to a *running*
      # instance is a raise, not a quit (see lmcCore::processStartupSwitches).
      #
      # First instance runs with /trace; log path must match the Dump step below.
      - name: Smoke start installed app
        run: |
          set -euo pipefail
          lmc /trace /loopback /noconfig &
          app_pid=$!
          # No grace sleep: the SingleInstance guard heals a transient lock
          # winner via resolveStartup() (see apprunner.cpp), so a probe that
          # raced ahead can no longer leave the first instance invisible —
          # the poll below converges instead of timing out.
          rc=0
          iter=0
          for _ in $(seq 1 120); do
            iter=$((iter + 1))
            rc=0
            lmc /inst >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 1 ]; then echo "app visible via /inst after ~$((iter / 2))s"; break; fi
            if ! kill -0 $app_pid 2>/dev/null; then echo "first instance died during poll #$iter" >&2; break; fi
            sleep 0.5
          done
          if [ "$rc" -ne 1 ]; then
            echo 'app did not start' >&2
            if kill -0 $app_pid 2>/dev/null; then kill -9 $app_pid 2>/dev/null || true; else wait $app_pid || echo "first exit=$?" >&2; fi
            exit 1
          fi
          if ! kill -0 $app_pid 2>/dev/null; then
            echo 'first instance died after taking the lock' >&2
            wait $app_pid || echo "first exit=$?" >&2
            exit 1
          fi
          timeout 60 lmc /termwait
          for _ in $(seq 1 60); do
            kill -0 $app_pid 2>/dev/null || break
            sleep 0.5
          done
          if kill -0 $app_pid 2>/dev/null; then echo 'app did not exit on /termwait' >&2; kill -9 $app_pid; exit 1; fi
          wait $app_pid
          lmc /inst

      # Relocatable launch: lmc.sh must resolve the app dir from its own
      # location, not from a hardcoded /usr/lib/lmc. Runs the launcher
      # from an extracted (never installed) payload tree. Full lifecycle
      # (exec/IPC/graceful exit) is covered by the installed smoke above —
      # here a single /quit start is enough to prove the extracted tree
      # launches through lmc.sh.
      - name: Smoke start extracted payload via lmc.sh
        run: |
          set -euo pipefail
          trap 'rm -rf /tmp/reloc' EXIT
          rm -rf /tmp/reloc
          mkdir -p /tmp/reloc
          deb=(dist/lmc_*.deb)
          if [ ! -f "${deb[0]}" ]; then echo 'deb not found in dist/' >&2; exit 1; fi
          dpkg-deb -x "./${deb[0]}" /tmp/reloc
          test -x /tmp/reloc/usr/lib/lmc/lmc.sh
          timeout 60 /tmp/reloc/usr/lib/lmc/lmc.sh /loopback /noconfig /quit

      - name: Dump package state on failure
        if: failure()
        run: |
          echo "DISPLAY=${DISPLAY:-<unset>}"
          ls -la /tmp/.X11-unix/ || true
          dpkg -l | grep -i lmc || true
          dpkg -L lmc || true
          echo '--- app trace ---'
          trace=$(ls -t ~/.local/share/lmc/lmc/logs/lmc_*.log 2>/dev/null | head -1 || true)
          if [ -n "${trace:-}" ]; then echo "== $trace"; cat "$trace"; else echo 'no trace file'; ls -la ~/.local/share/lmc/lmc/logs/ 2>/dev/null || true; fi
