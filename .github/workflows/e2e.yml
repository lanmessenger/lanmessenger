# E2E: full tests/robot/ on 4 OS legs as a SOFT gate. This workflow never
# compiles: the binaries under test come from build.yml (job build-test
# below; artifacts test-layout-<leg>, same run — contract documented in both
# headers). Skipped only when the caller already built them (skip-build).
#
# Legs: linux-x64, windows-x64, macos-arm64, macos-x64. Every leg runs the
# same full suite (lmc scenarios plus the lmm/ self-checks) with HOLD_OPEN:0s.
#
# Flake policy: every leg runs the suite once, then --rerunfailed exactly
# once, then rebot --merge. A real breakage stays red after the retry; a
# one-off runner/network flake goes green. Do NOT add more retries here:
# repeated retries mask real instability.
#
# Soft gate: this workflow reports per-leg checks but is NOT in branch
# protection yet. Promote to required after a series of green runs.
name: E2E

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      windows-ssl:
        description: Windows OpenSSL source for the test build
        type: choice
        options: [choco, vcpkg]
        default: choco
      version:
        description: Version string to build and seed (default 0.0.0)
        type: string
        default: ''
      ref:
        description: Git ref to test (defaults to the triggering commit)
        type: string
        default: ''
  workflow_call:
    inputs:
      windows-ssl:
        description: Windows OpenSSL source for the test build
        type: string
        default: choco
      version:
        description: Version string to build and seed
        type: string
        default: ''
      ref:
        description: Git ref to test (defaults to the triggering commit)
        type: string
        default: ''
      skip-build:
        description: Download a test layout built by another job in the same run instead of building
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compilation lives in build.yml; this job orders the test layout for the
  # legs below. Skipped only when the caller (release/nightly) already built
  # it in the same run via skip-build=true: same artifact names either way.
  build-test:
    if: ${{ !inputs.skip-build }}
    uses: ./.github/workflows/build.yml
    with:
      artifacts: test
      windows-ssl: ${{ inputs.windows-ssl || 'choco' }}
      version: ${{ inputs.version || '0.0.0' }}
      ref: ${{ inputs.ref }}

  e2e:
    needs: [build-test]
    # needs + skipped: without always() a skipped build-test (skip-build
    # path) would skip the legs too. Run on success (own build) or skipped
    # (caller built); never on failure/cancel (no binaries to test).
    if: always() && (needs.build-test.result == 'success' || needs.build-test.result == 'skipped')
    name: e2e (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One red leg must not kill the other three: every report is evidence.
      fail-fast: false
      matrix:
        include:
          - leg: linux-x64
            os: ubuntu-24.04
            timeout: 45
          - leg: windows-x64
            os: windows-2022
            timeout: 120
          - leg: macos-arm64
            os: macos-14
            timeout: 120
          - leg: macos-x64
            os: macos-15-intel
            timeout: 120
    env:
      PKG_VERSION: ${{ inputs.version || '0.0.0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # ---- Linux runtime (no compilation: binaries come from build-test) ----
      # System Qt 6.2, like the test layout was built against (oldest
      # baseline); no install-qt-action here on purpose. Runtime subset of
      # the build env: no compilers, no cmake.
      - name: Install runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-base-dev-tools \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-translations-l10n \
            qt6-multimedia-dev \
            libssl-dev \
            xvfb xauth x11-utils \
            python3-pip python3-venv

      - name: Download test layout (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v7
        with:
          name: test-layout-linux-x64
          path: _test-layout

      - name: Extract test layout (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -xzf _test-layout/test-layout-linux-x64.tar.gz
          test -x lmc/release/lan-messenger-test
          test -x build/tools/lmm/lmmd

      - name: Set up Python and Robot Framework (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv .venv-robot-ci
          .venv-robot-ci/bin/pip install -r tests/robot/requirements.txt

      # ---- Windows runtime (no compilation: binaries come from build-test) ----
      # No MSVC, no vcpkg, no Qt install: the test layout already contains
      # the windeployqt output + OpenSSL DLLs. The image's VC++ redist
      # covers running (no linking happens here).
      - name: Download test layout (Windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v7
        with:
          name: test-layout-windows-x64
          path: _test-layout

      - name: Extract test layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tar -xzf _test-layout/test-layout-windows-x64.tar.gz
          if (-not (Test-Path lmc/release/lan-messenger-test.exe)) { throw "test binary missing" }
          if (-not (Test-Path build/tools/lmm/lmmd.exe)) { throw "lmmd missing" }

      # macOS still installs Qt: the test layout's .app links the Qt libs
      # from QT_ROOT_DIR (only Plugins ride inside the bundle).
      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'macOS'
        with:
          version: '6.8.3'
          arch: clang_64
          modules: 'qtmultimedia qtshadertools qtimageformats'
          cache: true

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          mkdir -p openssl
          ln -sfn "$(brew --prefix openssl@3)/include" openssl/include
          ln -sfn "$(brew --prefix openssl@3)/lib" openssl/lib

      # ---- macOS runtime (no compilation: binaries come from build-test) ----
      # The Plugins copy lives in the tarball now (apprunner.cpp REPLACES
      # the default Qt plugin paths with Contents/Plugins, so without it
      # the app blocks in the "missing openssl" box before the agent starts).
      - name: Download test layout (macOS)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v7
        with:
          name: test-layout-${{ matrix.leg }}
          path: _test-layout

      - name: Extract test layout (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tar -xzf "_test-layout/test-layout-${{ matrix.leg }}.tar.gz"
          test -x lmc/release/LAN-Messenger.app/Contents/MacOS/lan-messenger-test
          test -x build/tools/lmm/lmmd

      - name: Set up Python and Robot Framework (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          py -3 -m venv .venv-robot-ci
          .venv-robot-ci/Scripts/pip install -r tests/robot/requirements.txt

      - name: Set up Python and Robot Framework (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 -m venv .venv-robot-ci
          .venv-robot-ci/bin/pip install -r tests/robot/requirements.txt

      # ---- Native settings seed (spike-proven per OS) ----
      # The main window shows at startup only with AutoShow=true.
      # Version must match the tested binary (built with $PKG_VERSION):
      # a newer Version resets the config and blocks startup modally.
      - name: Seed lmc settings (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.config/lmc"
          cat > "$HOME/.config/lmc/lmc.ini" <<EOF
          [General]
          AutoShow=true

          [Application]
          Version=$PKG_VERSION

          [User]
          Name=E2E Tester
          EOF

      - name: Seed lmc settings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:APPDATA\LAN Messenger"
          New-Item -ItemType Directory -Force $dir | Out-Null
          @"
          [General]
          AutoShow=true

          [Application]
          Version=$env:PKG_VERSION

          [User]
          Name=E2E Tester
          "@ | Set-Content "$dir\LAN Messenger.ini" -Encoding ASCII
          Get-Content "$dir\LAN Messenger.ini"

      - name: Seed lmc settings (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$HOME/.config/lmc"
          printf '[General]\nAutoShow=true\n\n[Application]\nVersion=%s\n\n[User]\nName=E2E Tester\n' \
            "$PKG_VERSION" > "$HOME/.config/lmc/lmc.ini"
          cat "$HOME/.config/lmc/lmc.ini"

      - name: Start virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          for i in $(seq 1 30); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break || sleep 1
          done
          xdpyinfo -display :99 >/dev/null

      # ---- Full suite + one flake-absorbing retry + merge ----
      - name: Run full suite (Linux)
        id: full_linux
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          DISPLAY: :99
        run: |
          export USER=ci
          export QT_QPA_PLATFORM=xcb
          export LD_LIBRARY_PATH="$PWD/lmc/release"
          .venv-robot-ci/bin/robot \
            --outputdir robot-results-full \
            -v APP_PATH:"$PWD/lmc/release/lan-messenger-test" \
            -v LMMD_BIN:"$PWD/build/tools/lmm/lmmd" \
            -v HOLD_OPEN:0s \
            tests/robot/

      - name: Run full suite (Windows)
        id: full_windows
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          # HOME is unset on Windows runners, but the suites anchor their
          # seeded lmc.ini at %{HOME}/.config (the app itself reads the
          # %APPDATA% seed above; this dir is the suites' scratch space).
          $env:HOME = "$env:RUNNER_TEMP\e2e-home"
          $env:PATH = "$PWD\lmc\release;$env:PATH"
          # Qt static file dialogs are native (IFileDialog) unless told
          # otherwise: without this the agent cannot see fileNameEdit
          # (same reason LMC_NON_NATIVE_DIALOGS exists on macOS).
          $env:LMC_NON_NATIVE_DIALOGS = "1"
          .venv-robot-ci/Scripts/robot `
            --outputdir robot-results-full `
            -v APP_PATH:"$PWD\lmc\release\lan-messenger-test.exe" `
            -v LMMD_BIN:"$PWD\build\tools\lmm\lmmd.exe" `
            -v HOLD_OPEN:0s `
            tests/robot/

      - name: Run full suite (macOS)
        id: full_macos
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          cd lmc/release
          export LMC_NON_NATIVE_DIALOGS=1
          export DYLD_FRAMEWORK_PATH="$QT_ROOT_DIR/lib"
          export DYLD_LIBRARY_PATH="$PWD/LAN-Messenger.app/Contents/MacOS:$QT_ROOT_DIR/lib"
          "$GITHUB_WORKSPACE/.venv-robot-ci/bin/robot" \
            --outputdir "$GITHUB_WORKSPACE/robot-results-full" \
            -v APP_PATH:"$PWD/LAN-Messenger.app/Contents/MacOS/lan-messenger-test" \
            -v LMMD_BIN:"$GITHUB_WORKSPACE/build/tools/lmm/lmmd" \
            -v HOLD_OPEN:0s \
            "$GITHUB_WORKSPACE/tests/robot/"

      - name: Rerun failed tests once (Linux)
        id: rerun_linux
        if: runner.os == 'Linux' && steps.full_linux.outcome == 'failure'
        continue-on-error: true
        env:
          DISPLAY: :99
        run: |
          export USER=ci
          export QT_QPA_PLATFORM=xcb
          export LD_LIBRARY_PATH="$PWD/lmc/release"
          .venv-robot-ci/bin/robot \
            --rerunfailed robot-results-full/output.xml \
            --outputdir robot-results-rerun \
            -v APP_PATH:"$PWD/lmc/release/lan-messenger-test" \
            -v LMMD_BIN:"$PWD/build/tools/lmm/lmmd" \
            -v HOLD_OPEN:0s \
            tests/robot/

      - name: Rerun failed tests once (Windows)
        id: rerun_windows
        if: runner.os == 'Windows' && steps.full_windows.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:HOME = "$env:RUNNER_TEMP\e2e-home"
          $env:PATH = "$PWD\lmc\release;$env:PATH"
          $env:LMC_NON_NATIVE_DIALOGS = "1"
          .venv-robot-ci/Scripts/robot `
            --rerunfailed robot-results-full/output.xml `
            --outputdir robot-results-rerun `
            -v APP_PATH:"$PWD\lmc\release\lan-messenger-test.exe" `
            -v LMMD_BIN:"$PWD\build\tools\lmm\lmmd.exe" `
            -v HOLD_OPEN:0s `
            tests/robot/

      - name: Rerun failed tests once (macOS)
        id: rerun_macos
        if: runner.os == 'macOS' && steps.full_macos.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          cd lmc/release
          export LMC_NON_NATIVE_DIALOGS=1
          export DYLD_FRAMEWORK_PATH="$QT_ROOT_DIR/lib"
          export DYLD_LIBRARY_PATH="$PWD/LAN-Messenger.app/Contents/MacOS:$QT_ROOT_DIR/lib"
          "$GITHUB_WORKSPACE/.venv-robot-ci/bin/robot" \
            --rerunfailed "$GITHUB_WORKSPACE/robot-results-full/output.xml" \
            --outputdir "$GITHUB_WORKSPACE/robot-results-rerun" \
            -v APP_PATH:"$PWD/LAN-Messenger.app/Contents/MacOS/lan-messenger-test" \
            -v LMMD_BIN:"$GITHUB_WORKSPACE/build/tools/lmm/lmmd" \
            -v HOLD_OPEN:0s \
            "$GITHUB_WORKSPACE/tests/robot/"

      - name: Merge reports (Linux/macOS)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          inputs="robot-results-full/output.xml"
          if [ -f robot-results-rerun/output.xml ]; then
            inputs="$inputs robot-results-rerun/output.xml"
          fi
          if [ ! -f robot-results-full/output.xml ]; then
            echo "NO ROBOT OUTPUT: full run produced no output.xml (see Run full suite above)" >&2
            exit 1
          fi
          rc=0
          # NOTE: --output is explicit because `rebot --merge` in RF 7.5
          # writes only log+report by default, no output.xml (the Check
          # step below parses the merged XML).
          .venv-robot-ci/bin/rebot --merge -d robot-results --output output.xml $inputs || rc=$?
          if [ "$rc" -gt 250 ]; then
            echo "rebot execution error (rc=$rc), not test failures" >&2
            exit 1
          fi
          # rc 0-250 is the failed-test count in the merged output; the
          # verdict belongs to the Check step below, not to the merge.
          exit 0

      - name: Merge reports (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $inputs = @("robot-results-full/output.xml")
          if (Test-Path "robot-results-rerun/output.xml") { $inputs += "robot-results-rerun/output.xml" }
          if (-not (Test-Path "robot-results-full/output.xml")) { throw "NO ROBOT OUTPUT: full run produced no output.xml (see Run full suite above)" }
          # NOTE: --output is explicit because `rebot --merge` in RF 7.5
          # writes only log+report by default, no output.xml (the Check
          # step below parses the merged XML).
          .venv-robot-ci/Scripts/rebot --merge -d robot-results --output output.xml @inputs
          $rc = $LASTEXITCODE
          if ($rc -gt 250) { throw "rebot execution error (rc=$rc), not test failures" }
          # rc 0-250 is the failed-test count in the merged output; the
          # verdict belongs to the Check step below, not to the merge.
          exit 0

      - name: Check merged result (Linux/macOS)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if [ ! -f robot-results/output.xml ]; then
            echo "NO MERGED OUTPUT: merge produced nothing (see Merge reports above)" >&2
            exit 1
          fi
          python3 -c "
          import sys, xml.etree.ElementTree as ET
          root = ET.parse('robot-results/output.xml').getroot()
          tests = list(root.iter('test'))
          failed = [t.get('name') for t in tests if t.find('status').get('status') != 'PASS']
          print(f'{len(tests)} tests, {len(failed)} failed')
          for n in failed:
              print('FAILED:', n)
          sys.exit(1 if failed else 0)
          "

      - name: Check merged result (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "robot-results/output.xml")) { throw "NO MERGED OUTPUT: merge produced nothing (see Merge reports above)" }
          py -3 -c "import sys, xml.etree.ElementTree as ET; root = ET.parse('robot-results/output.xml').getroot(); tests = list(root.iter('test')); failed = [t.get('name') for t in tests if t.find('status').get('status') != 'PASS']; print(str(len(tests)) + ' tests, ' + str(len(failed)) + ' failed'); [print('FAILED: ' + n) for n in failed]; sys.exit(1 if failed else 0)"

      - name: Upload robot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results-${{ matrix.leg }}
          path: robot-results-*
          if-no-files-found: warn
          retention-days: 3
