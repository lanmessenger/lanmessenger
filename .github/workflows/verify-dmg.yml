# Smoke test for a macOS .dmg: mounts the exact packages-macos-<suffix>
# artifact built by build.yml (build-macos matrix leg) on a fresh runner,
# drag-installs the bundle to /Applications like a user would, and starts
# the installed app. Shared by release.yml and nightly.yml so the publish
# gates cannot drift apart.
#
# Inputs pin the architecture: arch-suffix selects the artifact
# (packages-macos-<suffix>) and the dmg inside it (lmc_*_<suffix>.dmg),
# runs-on selects the matching runner (x86_64 vs arm64). No rebuild here
# by design.
name: Verify dmg

on:
  workflow_call:
    inputs:
      arch-suffix:
        description: 'Architecture suffix (x86_64 or arm64)'
        required: true
        type: string
      runs-on:
        description: 'Runner matching the architecture'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-macos-${{ inputs.arch-suffix }}
          path: dist
          merge-multiple: true

      - name: List package artifact
        run: ls -la dist

      # Drag-install like a user: mount, check the volume carries the
      # Applications symlink for Finder installs, copy the bundle.
      # The quarantine clear is belt-and-braces: CI artifacts carry no
      # quarantine xattr, but a future signed build might.
      - name: Install app bundle
        run: |
          set -euo pipefail
          dmg=(dist/lmc_*_${{ inputs.arch-suffix }}.dmg)
          if [ ! -f "${dmg[0]}" ]; then echo 'dmg not found in dist/' >&2; exit 1; fi
          # The dmg carries an SLA license (dmgbuild `license` setting,
          # like the old Rez-embedded one): agree non-interactively, as a
          # user clicking "Agree". `echo` (not `yes`) keeps `pipefail`
          # green — no SIGPIPE when hdiutil closes stdin.
          echo Y | hdiutil attach "${dmg[0]}" -mountpoint /Volumes/lmc-smoke -nobrowse
          ls -la /Volumes/lmc-smoke
          test -L /Volumes/lmc-smoke/Applications
          codesign --verify --deep --strict --verbose=2 /Volumes/lmc-smoke/LAN-Messenger.app
          rm -rf /Applications/LAN-Messenger-smoke.app
          cp -R /Volumes/lmc-smoke/LAN-Messenger.app /Applications/LAN-Messenger-smoke.app
          xattr -dr com.apple.quarantine /Applications/LAN-Messenger-smoke.app || true
          codesign --verify --deep --strict --verbose=2 /Applications/LAN-Messenger-smoke.app

      - name: Verify bundle layout
        run: |
          set -euo pipefail
          app=/Applications/LAN-Messenger-smoke.app
          info="$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/LAN-Messenger"
          test -d "$app/Contents/Frameworks"
          # The app blocks in the "missing openssl" modal when QSslSocket
          # finds no TLS backend (apprunner.cpp supportsSsl check), so the
          # bundle must carry PlugIns/tls (macdeployqt stages it; an E2E
          # spike env without it hung before the test agent started).
          test -d "$app/Contents/PlugIns/tls"
          test -d "$app/Contents/PlugIns/sqldrivers"
          test -e "$app/Contents/PlugIns/sqldrivers/libqsqlite.dylib"
          for f in "$app/Contents/MacOS/lmc.rcc" "$app/Contents/Info.plist" \
                   "$app/Contents/MacOS/lang/de_DE.qm" \
                   "$app/Contents/MacOS/lang/system/qtbase_de.qm"; do
            test -e "$f" || { echo "missing $f" >&2; exit 1; }
          done
          # Regression gate for the missing-LC_RPATH packaging bug: the
          # main binary links Qt via @rpath, so it must carry an RPATH
          # into the bundled Frameworks or dyld aborts at launch.
          otool -l "$app/Contents/MacOS/LAN-Messenger" | grep -q '@executable_path/../Frameworks' \
            || { echo 'missing Frameworks LC_RPATH in main binary' >&2; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = "io.github.lanmessenger.lmc"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$info")" = "LAN-Messenger"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info")" = "LAN Messenger"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info")"
          test "$exe" = "LAN-Messenger"
          test -x "$app/Contents/MacOS/$exe"
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")"
          printf '%s' "$short" | grep -Eq '^[0-9]+(\.[0-9]+){2}$'
          printf '%s' "$build" | grep -Eq '^[0-9]+(\.[0-9]+)*$'
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign-installed.txt"
          grep -q 'Signature=adhoc' "$RUNNER_TEMP/codesign-installed.txt"
          if grep -q 'linker-signed' "$RUNNER_TEMP/codesign-installed.txt"; then
            echo 'installed app is still linker-signed' >&2
            exit 1
          fi
          # Diagnostic only: ad-hoc without notarization always fails
          # Gatekeeper assessment, so never gate on it. Remove `|| true`
          # once we ship Developer ID + notarization.
          spctl --assess --type execute --verbose=4 "$app" || true

      # /quit exits after lmcCore::init without entering the event loop —
      # same coverage as the Linux smoke. macOS ships no timeout(1), so
      # python3 (preinstalled on the runner) caps a hang on a blocking
      # dialog. /inst must return 0 when no instance is running
      # (apprunner.cpp: tryBecomeServer() == HeldByOther ? 1 : 0).
      - name: Smoke start installed app
        run: |
          set -euo pipefail
          export USER=ci
          bin=/Applications/LAN-Messenger-smoke.app/Contents/MacOS/LAN-Messenger
          python3 - "$bin" <<'EOF'
          import subprocess, sys
          try:
            p = subprocess.run(
              [sys.argv[1], '/silent', '/loopback', '/noconfig', '/quit'],
              timeout=60)
          except subprocess.TimeoutExpired:
            print('smoke timed out after 60s', file=sys.stderr)
            sys.exit(1)
          if p.returncode != 0:
            print(f'smoke failed: {p.returncode}', file=sys.stderr)
            sys.exit(1)
          EOF
          "$bin" /inst

      - name: Smoke launch via LaunchServices
        run: |
          set -euo pipefail
          app=/Applications/LAN-Messenger-smoke.app
          bin="$app/Contents/MacOS/LAN-Messenger"
          python3 - "$app" "$bin" <<'EOF'
          import subprocess, sys
          app, bin = sys.argv[1], sys.argv[2]
          try:
            p = subprocess.run(
              ['open', '-W', '-n', app, '--args',
               '/silent', '/loopback', '/noconfig', '/quit'],
              timeout=60)
          except subprocess.TimeoutExpired:
            print('LaunchServices launch timed out after 60s', file=sys.stderr)
            sys.exit(1)
          if p.returncode != 0:
            print(f'LaunchServices launch failed: {p.returncode}', file=sys.stderr)
            sys.exit(1)
          # open reports launch, not the app exit code (the direct-binary
          # smoke above already checks it). Here ensure the LS instance
          # really processed --args /quit: no lingering process and no
          # single-instance lock left behind.
          lingering = subprocess.run(
            ['pgrep', '-x', 'LAN-Messenger'],
            capture_output=True, text=True)
          if lingering.returncode == 0:
            print(f'LS instance still running: {lingering.stdout.strip()}', file=sys.stderr)
            sys.exit(1)
          q = subprocess.run([bin, '/inst'])
          if q.returncode != 0:
            print(f'smoke app still registered after LS /quit: {q.returncode}', file=sys.stderr)
            sys.exit(1)
          EOF

      # Diagnostics for dyld failures: shows whether the bundle carries
      # its Frameworks and whether the main binary has an LC_RPATH
      # pointing at them. Must run before the uninstall below.
      - name: Dump bundle linkage on failure
        if: failure()
        run: |
          app=/Applications/LAN-Messenger-smoke.app
          ls "$app/Contents/Frameworks" || true
          ls "$app/Contents/PlugIns" || true
          otool -L "$app/Contents/MacOS/LAN-Messenger" || true
          otool -l "$app/Contents/MacOS/LAN-Messenger" | grep -A2 LC_RPATH || echo 'no LC_RPATH found'
          codesign --verify --deep --strict --verbose=4 "$app" || true
          /usr/libexec/PlistBuddy -c 'Print' "$app/Contents/Info.plist" || true

      - name: Uninstall test app
        if: always()
        run: |
          bin=/Applications/LAN-Messenger-smoke.app/Contents/MacOS/LAN-Messenger
          # Graceful close first (covers cold /termwait when nothing runs);
          # pkill stays as a fallback for a wedged instance.
          "$bin" /termwait || true
          pkill -f '/Applications/LAN-Messenger-smoke.app/Contents/MacOS/LAN-Messenger' || true
          rm -rf /Applications/LAN-Messenger-smoke.app
          hdiutil detach /Volumes/lmc-smoke -force || true
