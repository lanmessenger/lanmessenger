name: Build

# Compilation lives here and ONLY here: e2e.yml never compiles, it downloads
# the test-layout tarballs produced below (artifact contract documented in
# both headers: test-layout-<leg>, same run).
#
# artifacts=release (default) — package-local + unit tests + smoke, then the
#   platform packages (deb/rpm, NSIS exe, dmg) + upload packages-*. Release
#   legs always use vcpkg/brew/apt OpenSSL: what ships is always the honest
#   build. Manual dispatch and release/nightly packaging.
# artifacts=test — package-local + unit tests + smoke, then lan-messenger-test +
#   lmmd (+ windeployqt/plugins staging), tarred as test-layout-<leg> for
#   e2e. No packaging. Windows OpenSSL follows windows-ssl (choco on commits
#   for speed, vcpkg on releases, default vcpkg); Linux/macOS always use
#   system/brew. choco is allowed only with artifacts=test — enforced by
#   the Validate inputs step in build-windows, the steps below check only
#   windows-ssl.
# artifacts=release+test — both on one runner (release path): the test layout
#   is assembled by COPYING release into $RUNNER_TEMP/teststage and
#   adding the test files to the copy. The original tree is never modified,
#   so the packages cannot contain test binaries by construction.
#   A shared configure means one OpenSSL for both halves, hence vcpkg.
#
# No push/PR triggers: every push/PR goes through e2e.yml, which orders its
# own test build here. Direct runs via workflow_call and workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: Which artifacts to produce
        type: choice
        options: [release, test, release+test]
        default: release
      windows-ssl:
        description: Windows OpenSSL source for the test layout (packaging always uses vcpkg)
        type: choice
        options: [choco, vcpkg]
        default: vcpkg
      version:
        description: Version string used in package names
        type: string
        default: ''
      installer_version:
        description: Four-part version for the Windows installer
        type: string
        default: ''
      ref:
        description: Git ref to build (defaults to the triggering commit)
        type: string
        default: ''
  workflow_call:
    inputs:
      artifacts:
        description: Which artifacts to produce
        type: string
        default: release
      windows-ssl:
        description: Windows OpenSSL source for the test layout (packaging always uses vcpkg)
        type: string
        default: vcpkg
      version:
        description: Version string used in package names
        type: string
        default: ''
      installer_version:
        description: Four-part version for the Windows installer
        type: string
        default: ''
      ref:
        description: Git ref to build (defaults to the triggering commit)
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux, oldest baseline (Ubuntu 22.04, Qt 6.2, glibc 2.35): one system-Qt
  # package per arch installs and runs on any newer Debian-family distro.
  build-linux:
    runs-on: ubuntu-22.04
    env:
      PKG_VERSION: ${{ inputs.version || format('0.0.0.{0}', github.run_number) }}
      PKG_INSTALLER_VERSION: ${{ inputs.installer_version || format('0.0.0.{0}', github.run_number) }}
      QTDIR: /usr/lib/x86_64-linux-gnu/qt6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev qt6-base-dev-tools \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-translations-l10n \
            qt6-multimedia-dev \
            libqt6sql6-sqlite \
            libssl-dev libgl1-mesa-dev \
            xvfb xauth \
            fonts-noto-color-emoji

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLMC_RELEASE_DIR="$PWD/release" -DLMC_VERSION="$PKG_VERSION"

      - name: Build release layout
        run: cmake --build build --config Release --target package-local --parallel

      - name: Smoke test
        run: |
          export USER=ci
          cd release
          timeout 60 xvfb-run -a ./lan-messenger /loopback /noconfig /quit

      - name: Build unit tests
        run: cmake --build build --config Release --target lmc_unit_tests --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build test binaries
        if: inputs.artifacts != 'release'
        run: |
          cmake --build build --config Release --target lan-messenger-test lmmd --parallel
          test -x build/tools/lmc-agent/lan-messenger-test
          test -x build/tools/lmm/lmmd

      # The test layout is a COPY of the release tree in $RUNNER_TEMP: the
      # original release is only read, never modified, so packaging
      # below always sees the pristine tree.
      - name: Pack test layout
        if: inputs.artifacts != 'release'
        run: |
          STAGE="$RUNNER_TEMP/teststage"
          rm -rf "$STAGE"; mkdir -p "$STAGE/release" "$STAGE/build/tools/lmm"
          # Trailing /. copies CONTENTS (dest exists); without it cp would
          # nest release inside release and the layout would silently break.
          cp -r release/. "$STAGE/release/"
          test ! -e "$STAGE/release/release"
          cp build/tools/lmc-agent/lan-messenger-test "$STAGE/release/"
          test -x "$STAGE/release/lan-messenger-test"
          cp build/tools/lmm/lmmd "$STAGE/build/tools/lmm/"
          test -x "$STAGE/build/tools/lmm/lmmd"
          tar -C "$STAGE" -czf test-layout-linux-x64.tar.gz release build

      - name: Upload test layout
        if: inputs.artifacts != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: test-layout-linux-x64
          path: test-layout-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Build packages
        if: inputs.artifacts != 'test'
        env:
          NFPM_VERSION: 2.48.0
          NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
          NFPM_ARCH: x86_64
        run: |
          curl -sSLf --retry 3 -o /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
          mkdir -p /tmp/nfpm-bin && tar -xzf /tmp/nfpm.tar.gz -C /tmp/nfpm-bin nfpm
          cd setup/linux
          chmod +x stage.sh package.sh
          sh ./stage.sh
          NFPM=/tmp/nfpm-bin/nfpm sh ./package.sh "$PKG_VERSION"

      - name: Upload packages
        if: inputs.artifacts != 'test'
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: |
            setup/lmc_*.deb
            setup/lmc-*.rpm
            setup/lmc-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 3

  build-windows:
    runs-on: windows-2022
    env:
      PKG_VERSION: ${{ inputs.version || format('0.0.0.{0}', github.run_number) }}
      PKG_INSTALLER_VERSION: ${{ inputs.installer_version || format('0.0.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Explicit prohibition instead of compound conditions below: choco
      # OpenSSL exists only for fast test builds. Whatever ships links vcpkg
      # OpenSSL. Fails here, before any toolchain download burns minutes.
      - name: Validate inputs
        shell: pwsh
        run: |
          $artifacts = '${{ inputs.artifacts }}'
          $ssl = '${{ inputs.windows-ssl }}'
          if ($artifacts -ne 'test' -and $ssl -ne 'vcpkg') {
            Write-Error "::error::windows-ssl=choco is allowed only with artifacts=test. Release packaging always links vcpkg OpenSSL — that is what ships."
            exit 1
          }

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install OpenSSL
        if: inputs.windows-ssl == 'vcpkg'
        run: vcpkg install openssl:x64-windows

      - name: Prepare OpenSSL paths
        if: inputs.windows-ssl == 'vcpkg'
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          New-Item -ItemType Directory -Force openssl/include, openssl/lib, openssl/bin | Out-Null
          Copy-Item -Recurse $root/installed/x64-windows/include/openssl openssl/include/
          Copy-Item $root/installed/x64-windows/lib/libcrypto.lib openssl/lib/
          Copy-Item $root/installed/x64-windows/bin/libcrypto-*.dll openssl/bin/
          Copy-Item $root/installed/x64-windows/bin/libssl-*.dll openssl/bin/

      # Fast path (default): prebuilt Shining Light OpenSSL instead of
      # compiling the vcpkg port. Staged into the same ./openssl layout, so
      # Configure below is untouched. Floats on latest by design (speed over
      # pinning); the honest path is vcpkg, pinned by its baseline. The
      # install dir moved across majors (OpenSSL-Win64 up to 3.x, OpenSSL
      # since 4.x) and the import libs live under lib/VC/..., but
      # FindOpenSSL looks in lib/ — hence the search + copy-up below
      # (known Shining Light + CMake gotchas).
      - name: Install OpenSSL via Chocolatey
        if: inputs.windows-ssl != 'vcpkg'
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          $ssl = @("$env:ProgramFiles\OpenSSL", "$env:ProgramFiles\OpenSSL-Win64") `
            | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ssl) { throw "OpenSSL install dir not found under $env:ProgramFiles" }
          $exe = "$ssl\bin\openssl.exe"
          if (-not (Test-Path $exe)) { throw "openssl.exe not found in $ssl\bin" }
          & $exe version
          New-Item -ItemType Directory -Force openssl/include, openssl/lib, openssl/bin | Out-Null
          Copy-Item -Recurse "$ssl\include\openssl" openssl/include/
          $md = Get-ChildItem "$ssl\lib" -Recurse -Filter libcrypto.lib | Select-Object -First 1
          if (-not $md) { throw "libcrypto.lib not found under $ssl\lib" }
          Copy-Item "$($md.DirectoryName)\*.lib" openssl/lib/
          Copy-Item "$ssl\bin\libcrypto-*.dll" openssl/bin/
          Copy-Item "$ssl\bin\libssl-*.dll" openssl/bin/
          Get-ChildItem openssl/lib, openssl/bin | Format-Table Name, Length

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release "-DLMC_RELEASE_DIR=$PWD/release" "-DLMC_VERSION=$PKG_VERSION")
          if [ -d openssl ]; then
            args+=("-DOPENSSL_ROOT_DIR=$PWD/openssl")
          fi
          cmake "${args[@]}"

      - name: Build release layout
        run: cmake --build build --config Release --target package-local --parallel

      - name: Deploy Qt runtime
        shell: cmd
        run: |
          set QTDIR=%QT_ROOT_DIR%
          windeployqt --release release\lmc.exe

      # QSslSocket needs the Qt 6 TLS backend plugins; deploy them explicitly
      # in case windeployqt skipped them.
      - name: Ensure TLS plugins
        shell: pwsh
        run: |
          $dst = "release/tls"
          if (-not (Test-Path $dst)) {
            Copy-Item -Recurse "$env:QT_ROOT_DIR/plugins/tls" $dst
          }

      - name: Build unit tests
        run: cmake --build build --config Release --target lmc_unit_tests --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build test binaries
        if: inputs.artifacts != 'release'
        run: cmake --build build --config Release --target lan-messenger-test lmmd --parallel

      # The test layout is a COPY of the release tree in $RUNNER_TEMP: the
      # original release is only read, never modified, so the installer
      # step always sees the pristine tree. The OpenSSL DLLs ride along into
      # the test layout (never into the installer: this step only runs
      # off-release).
      - name: Pack test layout
        if: inputs.artifacts != 'release'
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\teststage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force "$stage\release", "$stage\build\tools\lmm" | Out-Null
          # release\* copies CONTENTS (dest exists); without the wildcard
          # Copy-Item would nest release inside release.
          Copy-Item -Recurse release\* "$stage\release"
          # e2e.yml runs Windows with no Qt install: the layout must carry
          # the windeployqt output beside the test binary. Assert that, not
          # just the absence of nesting (a broken windeployqt staging fails
          # the same silent way: exe present, agent never listens).
          if (-not (Test-Path "$stage\release\Qt6Core.dll")) { throw "Qt runtime missing beside test binary" }
          if (-not (Test-Path "$stage\release\platforms\qwindows.dll")) { throw "Qt platform plugin missing" }
          if (-not (Test-Path "$stage\release\sqldrivers\qsqlite.dll")) { throw "Qt sqlite driver missing" }
          Copy-Item build/tools/lmc-agent/lan-messenger-test.exe "$stage\release\"
          Copy-Item openssl/bin/*.dll "$stage\release\"
          Copy-Item build/tools/lmm/lmmd.exe "$stage\build\tools\lmm\"
          if (-not (Test-Path "$stage\release\lan-messenger-test.exe")) { throw "test binary missing" }
          if (-not (Test-Path "$stage\build\tools\lmm\lmmd.exe")) { throw "lmmd missing" }
          tar -C $stage -czf test-layout-windows-x64.tar.gz release build

      - name: Upload test layout
        if: inputs.artifacts != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: test-layout-windows-x64
          path: test-layout-windows-x64.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Build installer
        if: inputs.artifacts != 'test'
        shell: cmd
        run: |
          choco install nsis -y --no-progress
          cd setup\win32
          call setup.bat release %PKG_VERSION% %PKG_INSTALLER_VERSION%

      - name: Upload packages
        if: inputs.artifacts != 'test'
        uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: setup/lmc-*-win64.exe
          if-no-files-found: error
          retention-days: 3

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            leg: macos-x64
            runs-on: macos-15-intel
          - arch: arm64
            leg: macos-arm64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    env:
      PKG_VERSION: ${{ inputs.version || format('0.0.0.{0}', github.run_number) }}
      PKG_INSTALLER_VERSION: ${{ inputs.installer_version || format('0.0.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          modules: 'qtmultimedia qtshadertools qtimageformats'
          cache: true

      - name: Install OpenSSL
        run: |
          brew install openssl@3
          mkdir -p openssl
          ln -sfn "$(brew --prefix openssl@3)/include" openssl/include
          ln -sfn "$(brew --prefix openssl@3)/lib" openssl/lib

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release "-DLMC_RELEASE_DIR=$PWD/release" "-DLMC_VERSION=$PKG_VERSION")
          if [ -d openssl ]; then
            args+=("-DOPENSSL_ROOT_DIR=$PWD/openssl")
          fi
          cmake "${args[@]}"

      - name: Build release layout
        run: cmake --build build --config Release --target package-local --parallel

      - name: Verify native binary arch
        run: |
          lipo -archs release/LAN-Messenger.app/Contents/MacOS/LAN-Messenger | grep -q ${{ matrix.arch }}

      - name: Stage macOS app
        if: inputs.artifacts != 'test'
        run: |
          set -euo pipefail
          export QTDIR="$QT_ROOT_DIR"
          cd setup/mac
          chmod +x stage-mac-app
          bash ./stage-mac-app

      - name: Verify macOS signature and metadata
        if: inputs.artifacts != 'test'
        run: |
          set -euo pipefail
          app=setup/mac/LAN-Messenger.app
          info="$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q 'Signature=adhoc' "$RUNNER_TEMP/codesign.txt"
          if grep -q 'linker-signed' "$RUNNER_TEMP/codesign.txt"; then
            echo 'macOS app is still linker-signed' >&2
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = "io.github.lanmessenger.lmc"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$info")" = "LAN-Messenger"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info")" = "LAN Messenger"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info")"
          test "$exe" = "LAN-Messenger"
          test -x "$app/Contents/MacOS/$exe"
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")"
          printf '%s' "$short" | grep -Eq '^[0-9]+(\.[0-9]+){2}$'
          printf '%s' "$build" | grep -Eq '^[0-9]+(\.[0-9]+)*$'

      - name: Build disk image
        if: inputs.artifacts != 'test'
        run: |
          set -euo pipefail
          cd setup/mac
          # Hermetic venv: works with any python3 (system/Homebrew/toolcache),
          # immune to PEP 668, no --break-system-packages, no new actions.
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/pip" install "dmgbuild==1.6.7"
          rm -f "../lmc_${PKG_VERSION}_${{ matrix.arch }}.dmg"
          "$RUNNER_TEMP/dmgbuild-venv/bin/dmgbuild" -s dmg-settings.py \
            "LAN Messenger" "../lmc_${PKG_VERSION}_${{ matrix.arch }}.dmg"
          test -f "../lmc_${PKG_VERSION}_${{ matrix.arch }}.dmg"
          ls -lh "../lmc_${PKG_VERSION}_${{ matrix.arch }}.dmg"
          rm -rf LAN-Messenger.app

      - name: List disk image artifacts
        if: always() && inputs.artifacts != 'test'
        run: |
          ls -lh setup/*.dmg || true

      - name: Build unit tests
        run: cmake --build build --config Release --target lmc_unit_tests --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build test binaries
        if: inputs.artifacts != 'release'
        run: cmake --build build --config Release --target lan-messenger-test lmmd --parallel

      # The test layout is a COPY of the .app in $RUNNER_TEMP: the original
      # tree is only read, never modified, so the dmg staging sees the
      # pristine tree. The PlugIns copy mirrors what e2e used to do inline:
      # apprunner points the Qt plugin paths at Contents/PlugIns only when
      # Contents/PlugIns/platforms and Contents/PlugIns/tls exist, so
      # without it the test binary blocks on the missing-openssl dialog.
      - name: Pack test layout
        if: inputs.artifacts != 'release'
        shell: bash
        run: |
          STAGE="$RUNNER_TEMP/teststage"
          rm -rf "$STAGE"; mkdir -p "$STAGE/release" "$STAGE/build/tools/lmm"
          cp -R release/LAN-Messenger.app "$STAGE/release/"
          cp build/tools/lmc-agent/lan-messenger-test "$STAGE/release/LAN-Messenger.app/Contents/MacOS/"
          test -x "$STAGE/release/LAN-Messenger.app/Contents/MacOS/lan-messenger-test"
          cp build/tools/lmm/lmmd "$STAGE/build/tools/lmm/"
          test -x "$STAGE/build/tools/lmm/lmmd"
          mkdir -p "$STAGE/release/LAN-Messenger.app/Contents/PlugIns"
          cp -R "$QT_ROOT_DIR/plugins/"* "$STAGE/release/LAN-Messenger.app/Contents/PlugIns/"
          tar -C "$STAGE" -czf "test-layout-${{ matrix.leg }}.tar.gz" release build

      - name: Upload test layout
        if: inputs.artifacts != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: test-layout-${{ matrix.leg }}
          path: test-layout-${{ matrix.leg }}.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload packages
        if: inputs.artifacts != 'test'
        uses: actions/upload-artifact@v7
        with:
          name: packages-macos-${{ matrix.arch }}
          path: setup/lmc_*_${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 3
